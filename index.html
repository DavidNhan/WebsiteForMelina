<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Little Question for Melina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hearts" aria-hidden="true"></div>

  <main class="card">
    <div class="photo" id="photo"><span id="photoFiller">Photo</span></div>

    <section class="bear-area">
      <div class="bubble" id="bubble" aria-live="polite"></div>
      <img id="bear" class="bear hidden" alt="David Bear">
      <div class="bear-filler" id="bearFiller">🐻</div>
    </section>

    <div class="choices" id="choices"></div>
  </main>

  <div class="sound-controls" role="group" aria-label="Sound controls">
    <button class="mute" id="mute" type="button" aria-label="Turn sound off" aria-pressed="false">🔊</button>
    <input id="musicVolume" type="range" min="0" max="8" step="1" value="8" aria-label="Background music volume">
  </div>

  <script src="script.js"></script>
</body>
</html>
