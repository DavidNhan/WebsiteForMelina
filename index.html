<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Little Question for Melina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hearts" aria-hidden="true"></div>

  <main class="card">
    <div class="photo" id="photo"><span id="photoFiller">Photo</span></div>

    <section class="bear-area">
      <div class="bubble" id="bubble" aria-live="polite"></div>
      <img id="bear" class="bear hidden" alt="David Bear">
      <div class="bear-filler" id="bearFiller">🐻</div>
    </section>

    <div class="choices" id="choices"></div>
    <button class="mute" id="mute" title="Sound on/off">🔊</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
